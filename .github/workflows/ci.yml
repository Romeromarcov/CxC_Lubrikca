name: CI

# ``develop`` es la rama de trabajo real y ``main`` la de producción: si el CI
# solo corriera en ``main``, avisaría del problema DESPUÉS de que el código ya
# está en producción. Corriendo también en ``develop`` (y en los PR hacia ella)
# es una barrera antes del merge, no un reporte post-mortem.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxc
          POSTGRES_PASSWORD: cxc_ci_pw
          POSTGRES_DB: cxc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Postgres es el único backend del sistema: el de Google Sheets se
      # eliminó por completo del repositorio, así que esta base de CI es la
      # misma pieza que usa producción (ver src/cxc/db/). La necesitan
      # tests/test_repository_contract.py y la migración Alembic.
      DATABASE_URL: postgresql://cxc:cxc_ci_pw@localhost:5432/cxc_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy

      - name: Alembic (aplicar migraciones a la base de CI)
        run: alembic upgrade head

      - name: Pytest (tests + coverage >= 74%)
        run: pytest
