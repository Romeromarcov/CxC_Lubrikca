[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cxc-lubrikca"
version = "1.0.0"
description = "Backend del Sistema de Cobros y Conciliación de Lubrikca (CxC)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=cxc --cov-report=term-missing --cov-fail-under=74"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["cxc"]
# ``web/app.py`` estaba excluido y eso volvía la métrica engañosa
# (auditoría de agosto 2026): concentra el 59% de las sentencias del
# proyecto (5.582 de 9.428) y es donde vive casi toda la lógica
# financiera -- bandeja, ventas, cobranza, auditoría, los 101 endpoints.
# El "91,79%" que se reportaba era la cobertura de todo MENOS el archivo
# donde aparecieron los bugs de esa misma auditoría. Con app.py incluido
# el número real es 74,17% (app.py por sí solo: ~62%).
#
# El umbral queda en el valor real medido, no en uno aspiracional: sirve
# como trinquete contra retrocesos. Subirlo exige cubrir app.py.
#
# Dos cuidados con el umbral, ambos aprendidos rompiendo el CI:
#
# 1. ``--cov-fail-under`` compara contra el valor SIN redondear, no contra
#    el porcentaje que imprime el reporte. Un umbral igual al número
#    redondeado falla siempre.
# 2. La cifra tiene que medirse con la suite HERMÉTICA (ver
#    ``_entorno_hermetico`` en tests/conftest.py). Antes la cobertura
#    dependía de si la máquina tenía ``.env``: daba 74,16% en desarrollo y
#    73,10% en CI, así que un umbral tomado en local condenaba al pipeline
#    a estar rojo. Hoy da 74,17% en los dos lados.

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Carpetas de soporte/análisis ajenas al paquete (no son el deliverable).
# alembic/versions: migraciones autogeneradas, no se editan a mano.
extend-exclude = ["auditoria_soporte", "Info_Odoo", "tools", "scratch", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["cxc"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# cxc.web.app es la capa de glue web/API: maneja datos completamente dinamicos
# (filas dict de Google Sheets, respuestas dict de Odoo XML-RPC) y ya esta
# excluida de los requisitos de cobertura de pytest (ver [tool.coverage.run]
# arriba) por el mismo motivo. Tipar en modo estricto ese archivo (~5500
# lineas) requeriria un refactor grande sin beneficio proporcional; el modulo
# de dominio (engine, reconciliation, odoo, sheets, models) si se mantiene en
# modo estricto completo.
[[tool.mypy.overrides]]
module = "cxc.web.app"
ignore_errors = true
